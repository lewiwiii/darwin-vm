name: Prepare Darwin-VM Files

on:
  workflow_dispatch:
    inputs:
      ipsw_url:
        description: 'Direct URL to the 17.0.1 IPSW'
        required: true
        default: 'https://updates.cdn-apple.com/2023FallFCS/fullrestores/042-55433/87BA2B5F-F32A-4C61-8E58-82FAC1103C5A/iPhone13,2,iPhone13,3_17.0.1_21A340_Restore.ipsw' 
      device_name:
        description: 'Device Identifier (e.g. iPhone13,2)'
        required: true
        default: 'iPhone13,2'

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          
      - name: Install ipsw
        run: |
          brew install ipsw
        
      - name: Set up Environment & Run get_files
        env:
          DEVNAME: ${{ github.event.inputs.device_name }}
          URL: ${{ github.event.inputs.ipsw_url }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("get_files.sh")
          lines = path.read_text().splitlines(True)

          injection = r'''
          echo "Converting ramdisk to read/write image..."

          rm -f firmware/ramdisk_rw.dmg
          rm -f firmware/ramdisk_large.dmg

          hdiutil convert firmware/ramdisk.dmg \
            -format UDRW \
            -o firmware/ramdisk_rw.dmg

          mv firmware/ramdisk_rw.dmg firmware/ramdisk.dmg

          echo "Original image information:"
          hdiutil imageinfo firmware/ramdisk.dmg

          echo "Creating 1.5G raw image..."

          # Create a 1.5 GiB zero-filled raw disk image.
          dd if=/dev/zero \
             of=firmware/ramdisk_large.dmg \
             bs=1m \
             count=1536

          sync

          echo "Large image created:"
          ls -lh firmware/ramdisk_large.dmg

          echo "Attaching original ramdisk..."

          SOURCE_OUTPUT="$(hdiutil attach -nomount firmware/ramdisk.dmg)"
          echo "$SOURCE_OUTPUT"

          SOURCE_DEVICE="$(printf '%s\n' "$SOURCE_OUTPUT" | awk 'NR==1 {print $1}')"

          if [ -z "$SOURCE_DEVICE" ]; then
              echo "ERROR: Could not identify source device"
              exit 1
          fi

          echo "Source device: $SOURCE_DEVICE"

          echo "Attaching large image..."

          DEST_OUTPUT="$(hdiutil attach -nomount firmware/ramdisk_large.dmg)"
          echo "$DEST_OUTPUT"

          DEST_DEVICE="$(printf '%s\n' "$DEST_OUTPUT" | awk 'NR==1 {print $1}')"

          if [ -z "$DEST_DEVICE" ]; then
              echo "ERROR: Could not identify destination device"
              hdiutil detach "$SOURCE_DEVICE" || true
              exit 1
          fi

          echo "Destination device: $DEST_DEVICE"

          echo "Copying original APFS disk into larger image..."

          dd if="$SOURCE_DEVICE" \
             of="$DEST_DEVICE" \
             bs=512 \
             count=253952

          sync

          echo "Detaching source image..."
          hdiutil detach "$SOURCE_DEVICE"

          echo "Detaching destination image..."
          hdiutil detach "$DEST_DEVICE"

          echo "Replacing original ramdisk..."

          mv firmware/ramdisk_large.dmg firmware/ramdisk.dmg

          echo "Attaching expanded ramdisk..."

          ATTACH_OUTPUT="$(hdiutil attach -nomount firmware/ramdisk.dmg)"
          echo "$ATTACH_OUTPUT"

          CONTAINER_DEVICE="$(
              printf '%s\n' "$ATTACH_OUTPUT" |
              awk 'NR==2 {print $1}'
          )"

          if [ -z "$CONTAINER_DEVICE" ]; then
              echo "ERROR: Could not identify APFS container"
              exit 1
          fi

          echo "APFS container device: $CONTAINER_DEVICE"

          echo "APFS information before resize:"
          diskutil apfs list "$CONTAINER_DEVICE"

          echo "Growing APFS container to 1.5G..."

          diskutil apfs resizeContainer \
              "$CONTAINER_DEVICE" \
              1.5G

          echo "APFS information after resize:"
          diskutil apfs list "$CONTAINER_DEVICE"

          echo "Detaching expanded ramdisk..."
          hdiutil detach "$CONTAINER_DEVICE"

          echo "Expanded ramdisk ready."
          '''

          output = []
          injected = False

          for line in lines:
              output.append(line)

              if "Patching" in line and "echo" in line and not injected:
                  output.append(injection)
                  injected = True

          if not injected:
              raise SystemExit(
                  "ERROR: Could not find the expected Patching echo in get_files.sh"
              )

          path.write_text("".join(output))
          PY

          chmod +x get_files.sh fix_perms.sh
          ./get_files.sh

      - name: Verify extracted firmware
        run: |
          echo "=== Firmware directory ==="
          ls -lah firmware/

          echo
          echo "=== Ramdisk image ==="
          hdiutil imageinfo firmware/ramdisk.dmg | grep -E \
            "Total Bytes|Sector Count|Format"

          echo
          echo "=== Firmware tree ==="
          find firmware -maxdepth 2 -type f -print

      - name: Fix Permissions on macOS
        run: |
          echo "Skipping fix_perms.sh on macOS runner."
          echo "The ramdisk was successfully created and mounted."

      - name: Archive Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vm-firmware
          path: firmware/
