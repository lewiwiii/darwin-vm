name: Prepare Darwin-VM Files

on:
  workflow_dispatch:
    inputs:
      ipsw_url:
        description: 'Direct URL to the 17.0.1 IPSW'
        required: true
        default: 'https://updates.cdn-apple.com/2023FallFCS/fullrestores/042-55433/87BA2B5F-F32A-4C61-8E58-82FAC1103C5A/iPhone13,2,iPhone13,3_17.0.1_21A340_Restore.ipsw' 
      device_name:
        description: 'Device Identifier (e.g. iPhone13,2)'
        required: true
        default: 'iPhone13,2'

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          
      - name: Install ipsw
        run: |
          brew install ipsw
        
      - name: Set up Environment & Run get_files
        env:
          DEVNAME: ${{ github.event.inputs.device_name }}
          URL: ${{ github.event.inputs.ipsw_url }}
        run: |
          python3 -c '
          with open("get_files.sh", "r") as f:
              content = f.read()

          target = "ipsw extract firmware/ramdisk.dmg"
          replacement = """ipsw extract firmware/ramdisk.dmg

          echo "Expanding ramdisk to 1.5GB..."
          OLD_MNT=$(mktemp -d)
          NEW_MNT=$(mktemp -d)
          
          ORIG_DEV=$(hdiutil attach -nobrowse firmware/ramdisk.dmg | grep Apple_APFS | awk "{print \\$1}")
          sudo mount -t apfs "$ORIG_DEV" "$OLD_MNT"
          
          hdiutil create -size 1.5G -fs APFS -volname "com.apple.driver.BootCache" firmware/ramdisk_large.dmg
          NEW_DEV=$(hdiutil attach -nobrowse firmware/ramdisk_large.dmg | grep Apple_APFS | awk "{print \\$1}")
          sudo mount -t apfs "$NEW_DEV" "$NEW_MNT"
          
          sudo cp -a "$OLD_MNT/"* "$NEW_MNT/"
          
          sudo diskutil eject "$ORIG_DEV" || sudo hdiutil detach "$ORIG_DEV"
          sudo diskutil eject "$NEW_DEV" || sudo hdiutil detach "$NEW_DEV"
          
          mv firmware/ramdisk_large.dmg firmware/ramdisk.dmg
          rm -rf "$OLD_MNT" "$NEW_MNT"
          """

          if target in content:
              content = content.replace(target, replacement, 1)
          else:
              # Fallback injection point if string varies slightly
              content = content.replace("Patching firmware/ramdisk.dmg", replacement + "\nPatching firmware/ramdisk.dmg", 1)

          with open("get_files.sh", "w") as f:
              f.write(content)
          '

          chmod +x get_files.sh fix_perms.sh
          ./get_files.sh

      - name: Fix Permissions on macOS
        run: |
          ./fix_perms.sh firmware/ramdisk.dmg

      - name: Archive Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vm-firmware
          path: firmware/
