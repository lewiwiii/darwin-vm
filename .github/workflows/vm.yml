name: Prepare Darwin-VM Files

on:
  workflow_dispatch:
    inputs:
      ipsw_url:
        description: 'Direct URL to the 26.6 IPSW'
        required: true
        default: 'https://updates.cdn-apple.com/2026SummerFCS/fullrestores/140-57611/6832DCA8-460D-4130-978F-47E797778CC8/iPhone13,2,iPhone13,3_26.6_23G71_Restore.ipsw' 
      device_name:
        description: 'Device Identifier (e.g. iPhone13,2)'
        required: true
        default: 'iPhone13,2'

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          
      - name: Install ipsw
        run: |
          brew install ipsw
        
      - name: Set up Environment & Run get_files
        env:
          DEVNAME: ${{ github.event.inputs.device_name }}
          URL: ${{ github.event.inputs.ipsw_url }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          
          path = Path("get_files.sh")
          content = path.read_text()
          
          content = re.sub(r"(hdiutil\s+resize\s+-size\s+[^\n]+)", r"# \1", content)
          
          injection = r'''
          echo "Cloning into a healthy 1.5GB APFS ramdisk..."
          rm -f firmware/ramdisk_new.dmg
          hdiutil create -size 1.5g -fs APFS -volname "ramdisk" firmware/ramdisk_new.dmg
          
          mkdir -p /tmp/old_ramdisk /tmp/new_ramdisk
          hdiutil attach firmware/ramdisk.dmg -mountpoint /tmp/old_ramdisk -nobrowse
          hdiutil attach firmware/ramdisk_new.dmg -mountpoint /tmp/new_ramdisk -nobrowse
          
          echo "Copying files to new image (preserving attributes)..."
          sudo cp -a /tmp/old_ramdisk/. /tmp/new_ramdisk/
          
          hdiutil detach /tmp/old_ramdisk -force || true
          hdiutil detach /tmp/new_ramdisk -force || true
          
          mv firmware/ramdisk_new.dmg firmware/ramdisk.dmg
          echo "Expanded ramdisk ready."
          '''
          
          # Insert the injection right after the patching echo
          lines = content.splitlines(True)
          output = []
          injected = False
          
          for line in lines:
              output.append(line)
              if "Patching" in line and "echo" in line and not injected:
                  output.append(injection)
                  injected = True
                  
          if not injected:
              raise SystemExit("ERROR: Could not find the expected Patching echo in get_files.sh")
              
          path.write_text("".join(output))
          PY
          
          chmod +x get_files.sh fix_perms.sh
          ./get_files.sh
          
      - name: Verify extracted firmware
        run: |
          echo "=== Firmware directory ==="
          ls -lah firmware/

          echo
          echo "=== Ramdisk image ==="
          hdiutil imageinfo firmware/ramdisk.dmg | grep -E \
            "Total Bytes|Sector Count|Format"

          echo
          echo "=== Firmware tree ==="
          find firmware -maxdepth 2 -type f -print

      - name: Fix Permissions on macOS
        run: |
          printf 'y\n' | ./fix_perms.sh firmware/ramdisk.dmg

      - name: Archive Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vm-firmware
          path: firmware/
